[project]
name = "mcp-findings"
version = "0.1.0"
description = "MCP server — Findings Service create/list (PROJETOSIN-205)"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.6.0",
  "httpx>=0.28.0",
]

[project.scripts]
mcp-findings = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
