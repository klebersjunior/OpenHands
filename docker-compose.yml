# Agent Canvas — all-in-one stack (Agent Server + Automation + Frontend)
#
# Quick start (published image — portable to any machine with Docker):
#   mkdir -p projects
#   docker compose up -d
#   → http://localhost:8000/canvas
#
# Build from this repo (test local / unreleased changes).
# Requires siblings ../typescript-client and ../software-agent-sdk
# (clone endpoint lives in the local agent-server, not the published image):
#   mkdir -p projects
#   docker compose up --build -d
#   → builds and tags as AGENT_CANVAS_IMAGE (default: published tag below)
#
# Prefer a local tag while iterating:
#   AGENT_CANVAS_IMAGE=agent-canvas:local docker compose up --build -d
#
# Backend-only (no SPA) for multi-backend experiments:
#   docker compose -f docker-compose.backend-only.yml up --build
#   → http://localhost:8001  (API only; register in Manage backends)
#
# Override host port / projects path (e.g. Windows when :8000 is taken):
#   HOST_PORT=8001 PROJECTS_PATH=./projects docker compose up -d
#
# Pentest smoke (PROJETOSIN-200): Findings + Engagement Manager are included
# from services/*/docker-compose.fragment.yml. Same command — no extra `-f`.
# Requires SESSION_API_KEY (or LOCAL_BACKEND_API_KEY) plus FINDINGS_DB_PASSWORD
# and ENGMGR_DB_PASSWORD in `.env`. See docker/compose.env.example.
#   HOST_PORT=9000 docker compose up -d
#   → GET /api/pentest/me/capabilities via ingress → findings-service
#
# Android emulator (budtmo/docker-android, profile android-emulator):
#   COMPOSE_PROFILES=android-emulator HOST_PORT=9000 docker compose up -d
#   → ADB 127.0.0.1:5555, noVNC 127.0.0.1:6080, DNS android-emulator inside compose.
#
# Offensive runtimes (web / network / sast, profile pentest-runtimes):
#   COMPOSE_PROFILES=android-emulator,pentest-runtimes HOST_PORT=9000 docker compose up -d --build
#   → runtime-web :8090/:8080, runtime-network :8091/:55553, runtime-sast :8094 (loopback).
#
# Copy settings from docker/compose.env.example into `.env` (Compose loads it
# automatically) or pass `--env-file docker/compose.env.example`.
#
# Move a local build to another machine:
#   AGENT_CANVAS_IMAGE=agent-canvas:local docker compose build
#   docker save agent-canvas:local | gzip > agent-canvas-local.tar.gz
#   # on the other host:
#   gunzip -c agent-canvas-local.tar.gz | docker load
#   AGENT_CANVAS_IMAGE=agent-canvas:local docker compose up -d

# Sibling pentest services (B): Postgres + apps on the compose network.
# agent-canvas reaches them via FINDINGS_UPSTREAM / ENGMGR_UPSTREAM (Docker DNS),
# not 127.0.0.1 — those ports are not inside the canvas container.
include:
  - path: services/findings-service/docker-compose.fragment.yml
  - path: services/engagement-manager/docker-compose.fragment.yml
  - path: docker/runtimes/mobile/compose.android-emulator.fragment.yml
  - path: docker/runtimes/compose.pentest-runtimes.fragment.yml

services:
  agent-canvas:
    # x-release-please-version
    image: agent-canvas:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      # Local forks: typescript-client (file: dep) + software-agent-sdk (clone API).
      additional_contexts:
        typescript-client: ${TYPESCRIPT_CLIENT_PATH:-../typescript-client}
        # Prefer OH_AGENT_SERVER_LOCAL_PATH from .env (same as npm run dev).
        software-agent-sdk: ${SOFTWARE_AGENT_SDK_PATH:-${OH_AGENT_SERVER_LOCAL_PATH:-../software-agent-sdk}}
      args:
        # Pins match config/defaults.json — override via .env when needed.
        AGENT_SERVER_IMAGE: ${AGENT_SERVER_IMAGE:-ghcr.io/openhands/agent-server:1.40.1-python}
        AUTOMATION_VERSION: ${AUTOMATION_VERSION:-1.6.0}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/canvas}
        VITE_POSTHOG_API_KEY: ${VITE_POSTHOG_API_KEY:-}
        # Optional fallback when SOFTWARE_AGENT_SDK_PATH is unavailable:
        # rebuild Python packages from a software-agent-sdk git ref.
        AGENT_SERVER_SDK_GIT_REF: ${AGENT_SERVER_SDK_GIT_REF:-}
    container_name: agent-canvas
    ports:
      # Only the unified ingress is published; :18000/:18001 stay inside the container.
      - "${HOST_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      # Optional: pin keys so restarts / machines share the same credentials.
      # Leave unset to auto-generate and persist under the openhands-data volume.
      # When SESSION_API_KEY is set (required by Findings/EngMgr), share it.
      LOCAL_BACKEND_API_KEY: ${SESSION_API_KEY:-${LOCAL_BACKEND_API_KEY:-}}
      OH_SECRET_KEY: ${OH_SECRET_KEY:-}
      OH_SESSION_API_KEYS_0: ${SESSION_API_KEY:-${OH_SESSION_API_KEYS_0:-${LOCAL_BACKEND_API_KEY:-}}}
      # Sibling pentest upstreams (Docker DNS). Defaults match compose service names.
      FINDINGS_UPSTREAM: ${FINDINGS_UPSTREAM:-http://findings-service:8000}
      FINDINGS_SERVICE_URL: ${FINDINGS_SERVICE_URL:-http://findings-service:8000}
      SESSION_API_KEY: ${SESSION_API_KEY:-${LOCAL_BACKEND_API_KEY:-}}
      PENTEST_MCP_ROOT: /opt/mcp-servers
      ADB_HOST: ${ADB_HOST:-android-emulator}
      ADB_PORT: ${ADB_PORT:-5555}
      PENTEST_ADB_TARGET: ${PENTEST_ADB_TARGET:-emulator}
      EMULATOR_NOVNC_URL: ${EMULATOR_NOVNC_URL:-http://android-emulator:6080}
      ZAP_URL: ${ZAP_URL:-http://runtime-web:8080}
      RUNTIME_WEB_URL: ${RUNTIME_WEB_URL:-http://runtime-web:8090}
      RUNTIME_NETWORK_URL: ${RUNTIME_NETWORK_URL:-http://runtime-network:8091}
      RUNTIME_SAST_URL: ${RUNTIME_SAST_URL:-http://runtime-sast:8094}
      MSF_RPC_HOST: ${MSF_RPC_HOST:-runtime-network}
      MSF_RPC_PORT: ${MSF_RPC_PORT:-55553}
      MSF_PASSWORD: ${MSF_PASSWORD:-}
      PENTEST_ENGINE_URL_ALLOWLIST: ${PENTEST_ENGINE_URL_ALLOWLIST:-eng-engine-pentestagent,eng-engine-cai}
      PENTEST_ENGINE_PENTESTAGENT_URL: ${PENTEST_ENGINE_PENTESTAGENT_URL:-http://eng-engine-pentestagent:8080}
      PENTEST_ENGINE_CAI_ENABLED: ${PENTEST_ENGINE_CAI_ENABLED:-false}
      ENGMGR_UPSTREAM: ${ENGMGR_UPSTREAM:-http://engagement-manager:8000}
      DEFAULT_PENTEST_PROFILE: ${DEFAULT_PENTEST_PROFILE:-pentester}
      # Internal username/password gate (opt-in; compose defaults to on).
      APP_LOGIN_ENABLED: ${APP_LOGIN_ENABLED:-true}
      # Optional LLM credentials (can also be configured in the UI).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # Optional Cursor ACP credentials (also configurable via Secrets in the UI).
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_AUTH_TOKEN: ${CURSOR_AUTH_TOKEN:-}
      CURSOR_API_ENDPOINT: ${CURSOR_API_ENDPOINT:-}
      # Optional OpenCode ACP credentials (also configurable via Secrets in the UI).
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      VITE_DO_NOT_TRACK: ${VITE_DO_NOT_TRACK:-}
      AUTOMATION_BASE_URL: ${AUTOMATION_BASE_URL:-}
    volumes:
      # Settings, secrets, conversations, automation DB, session/API keys.
      - openhands-data:/home/openhands/.openhands
      # Host projects the agent can read/edit. Create the folder before first run.
      - ${PROJECTS_PATH:-./projects}:/projects
      # Pentest stdio MCP servers (recon/webscan/sast/mobile/findings).
      - ./services/mcp-servers:/opt/mcp-servers:ro
    depends_on:
      findings-service:
        condition: service_healthy
      engagement-manager:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/alive', timeout=5)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  openhands-data:
    name: ${OPENHANDS_VOLUME_NAME:-agent-canvas-openhands-data}
